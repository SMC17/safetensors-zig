name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig version
        run: zig version
      - name: zig build test
        # Real-model integration tests (test-realmodel, test-real-tinyllama)
        # are wired into the main test step but skip cleanly when their
        # fixtures (tests/fixtures/*.safetensors) are absent.
        run: zig build test --summary all
